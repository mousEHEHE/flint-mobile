# XcodeGen spec, adapted from gpui-mobile's example. Flint.xcodeproj is generated, not committed.
name: Flint
options:
  bundleIdPrefix: com.mouse
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: S7H6BD59M7

targets:
  Flint:
    type: application
    platform: iOS
    sources:
      - path: main.m
      - path: gpui_ios.h
        buildPhase: headers
      - path: LaunchScreen.storyboard
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mouse.flint
        PRODUCT_NAME: Flint
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_BITCODE: NO
        # Xcode's debug dylib loader fails on a device with the static Rust library.
        ENABLE_DEBUG_DYLIB: NO
        # The build script runs cargo, which writes outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: NO
        # The explicit .a path keeps the linker off the .dylib cargo builds next to it.
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(FLINT_STATIC_LIB)"
          - "-lc++"
          - "-framework UIKit"
          - "-framework Metal"
          - "-framework MetalKit"
          - "-framework QuartzCore"
          - "-framework CoreGraphics"
          - "-framework CoreText"
          - "-framework CoreFoundation"
          - "-framework Foundation"
          - "-framework Security"
          - "-framework SystemConfiguration"
          - "-framework AudioToolbox"
          - "-framework WebKit"
          - "-framework CoreMedia"
          - "-framework AVFoundation"
          - "-framework LocalAuthentication"
          - "-framework AuthenticationServices"
          - "-framework Contacts"
          - "-framework EventKit"
          - "-framework StoreKit"
          - "-framework CoreMotion"
          - "-ObjC"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)"
        ARCHS: "arm64"
        ONLY_ACTIVE_ARCH: YES
        "FLINT_STATIC_LIB[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../target/aarch64-apple-ios-sim/debug/libflint_mobile.a"
        "FLINT_STATIC_LIB[sdk=iphoneos*]": "$(PROJECT_DIR)/../target/aarch64-apple-ios/debug/libflint_mobile.a"
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: "0"
          # A dSYM of the Rust library is about 1 GB and slow to make.
          DEBUG_INFORMATION_FORMAT: "dwarf"
        Release:
          "FLINT_STATIC_LIB[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../target/aarch64-apple-ios-sim/release/libflint_mobile.a"
          "FLINT_STATIC_LIB[sdk=iphoneos*]": "$(PROJECT_DIR)/../target/aarch64-apple-ios/release/libflint_mobile.a"
          GCC_OPTIMIZATION_LEVEL: "s"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
    preBuildScripts:
      - name: "Build the Rust library"
        basedOnDependencyAnalysis: false
        # Xcode rejects a linker input that no build phase declares as its output.
        outputFiles:
          - "$(FLINT_STATIC_LIB)"
        shell: /bin/bash
        script: |
          set -euo pipefail
          # Xcode does not read the shell profile, so cargo is not on PATH.
          export PATH="$HOME/.cargo/bin:$PATH"
          # SDKROOT points at the iOS SDK and breaks cargo build scripts compiled for the Mac.
          # The iOS code finds its SDK through xcrun.
          unset SDKROOT
          cd "${PROJECT_DIR}/.."
          if [ "${PLATFORM_NAME}" = "iphonesimulator" ]; then
            target="aarch64-apple-ios-sim"
          else
            target="aarch64-apple-ios"
          fi
          profile=""
          if [ "${CONFIGURATION}" = "Release" ]; then
            profile="--release"
          fi
          cargo build --lib --target "$target" $profile
